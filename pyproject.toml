[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-lightning-forge"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "hydra-core>=1.3.2",
    "pytorch-lightning>=2.5.5",
]
readme = "README.md"

[project.optional-dependencies]
examples = [
    "torch",
    "torchvision",
]

[project.scripts]
hlforge-train = "hlforge.cli.train:main"

# Tells setuptools where to find source code and what to package
[tool.setuptools.packages.find]
where = ["src"]

# Dependency groups for development and examples with uv
[dependency-groups]
dev = [
    "pytest>=7.0",
    "black",
    "ruff",
]
examples = [
    "torch",
    "torchvision",
    "requests",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }


[tool.ruff]
line-length = 120

[tool.black]
line-length = 120

