name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-core-no-cuda:
    name: Verify core package (no CUDA wheels)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Verify hlforge core installation does not install CUDA wheels
        run: |
          uv pip install --no-sources .
          uv run python -c "import torch; print('Torch version:', torch.__version__); assert 'cu126' not in torch.__version__, f'CUDA 12.6 wheel found in core package installation: {torch.__version__}'"

      - name: Run core unit tests
        run: uv run pytest tests/test_core.py tests/test_core_no_cuda.py

  test-all:
    name: Run full test suite with examples
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Run all tests with pytest
        run: uv run --all-groups pytest tests/